apis:
- aid: adafruit-io:adafruit-io-mqtt-api
  name: Adafruit IO MQTT API
  tags:
  - IoT
  - Internet of Things
  - MQTT
  - Real-Time
  - Feeds
  tags_raw:
  - IoT
  - Internet of Things
  - MQTT
  - Realtime
  - Feeds
  humanURL: https://io.adafruit.com/api/docs/mqtt.html
  baseURL: mqtts://io.adafruit.com:8883
  properties:
  - url: https://io.adafruit.com/api/docs/mqtt.html
    type: Documentation
  - url: https://io.adafruit.com/api/docs/mqtt.html#mqtt-topics
    type: Documentation
  description: >-
    MQTT broker at io.adafruit.com for publish/subscribe access to Adafruit IO feeds and groups. TLS on
    port 8883, plaintext on 1883, and MQTT-over-WebSocket on port 443. Authenticate with your Adafruit
    IO username and API key. Supports QoS 0 and QoS 1 (QoS 2 not supported); MQTT retain flag is not honored
    — use the /get topic modifier to fetch the last value of a feed instead. Topic structure includes
    feed topics ({username}/feeds/{key}), compact aliases ({username}/f/{key}), JSON/CSV suffixes, group
    topics ({username}/groups/{key}), throttle ({username}/throttle), and errors ({username}/errors).
    Wildcard subscriptions with `+` and `#` are supported for feed discovery.
